<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
</head>
<body>
    <h1>User Bio Cleaner</h1>

    <script>

        let userProfile = {
            username: " CoolUser99 ",
            bio: " I LOVE coding! JavaScript is Great!!! "
        };

        function cleanUserBio(profile) {

            let cleanedUsername = profile.username.trim().toLowerCase();
            let cleanedBio = profile.bio.trim().toLowerCase();
            cleanedBio = cleanedBio.replaceAll("javascript", "JS");
            let bioLength = cleanedBio.length;
            return {
                username: cleanedUsername,
                bio: cleanedBio,
                bioLength: bioLength
            };
        }

        let finalResult = cleanUserBio(userProfile);
        console.log(finalResult);

    </script>
</body>
</html>
