<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Filtering System</title>
</head>
<body>
    <h1>Comment Filtering System</h1>

    <script>

        function filterComment(comment) {

            let bannedWords = /bad|ugly|stupid/gi;
            let hasBannedWord = bannedWords.test(comment);
            console.log("Contains banned word:", hasBannedWord);

            let cleanedComment = comment.replace(bannedWords, "***");
            let numbers = comment.match(/\d+/g);
            let numberCount = numbers ? numbers.length : 0;
            let capitalWords = comment.match(/\b[A-Z][a-z]*/g);
            let capitalWordCount = capitalWords ? capitalWords.length : 0;
            return "Cleaned Comment: " + cleanedComment +
                   "\nNumber Count: " + numberCount +
                   "\nCapitalized Word Count: " + capitalWordCount;
        }

        let comment = "I think this movie was BAD and 100% Stupid! But the Acting was Amazing and 3 actors were great.";
        console.log(filterComment(comment));

    </script>
</body>
</html>
