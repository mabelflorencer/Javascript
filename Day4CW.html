<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics Widget</title>
</head>
<body>
    <h2>Statistics Widget</h2><br>
    <script>
        let randomNumbers = Math.floor(Math.random() * 100) + 1;
        let userscore = "75";
        let userScoreNumber = Number(userscore);
        let difference = randomNumbers - userScoreNumber;
        let squareRoot = Math.round(Math.sqrt(userScoreNumber));
        let piValue = Math.PI;
        let conversion = "50"*2;

        console.log("Random Number: " + randomNumbers);
        console.log("User Score: " + userScoreNumber);
        console.log("Difference: " + difference);
        console.log("Square Root of User Score: " + squareRoot);
        console.log("Value of Pi: " + piValue);
        console.log("Conversion Result: " + conversion);
    </script>
</body>
</html>
