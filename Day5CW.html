<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Online Store Return</h1>

    <button onclick="checkReturn()">Check Return Eligibility</button>

    <p id="result"></p>

    <script>

        let order = {
            itemName: "Shoes",
            isDelivered: true,
            daysSinceDelivery: 5
        };

        function checkReturn() {

            let result = order.isDelivered && order.daysSinceDelivery <= 7
                ? "Eligible for Return"
                : "Return Period Expired";

            document.getElementById("result").innerHTML = result;

            console.log("Does itemName exist? " + ("itemName" in order));
            delete order.daysSinceDelivery;
            console.log("Updated order object:", order);
        }

    </script>
</body>
</html>
