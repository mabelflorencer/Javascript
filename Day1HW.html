<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Shop Calculator</title>
</head>
<body>
    <h1>Grocery Shop Calculator</h1>

    <script>

        let riceName = "Rice";
        let sugarName = "Sugar";
        let wheatName = "Wheat";

        let ricePrice = 60;
        let sugarPrice = 45;
        let wheatPrice = 50;

        let riceQuantity = 2;
        let sugarQuantity = 3;
        let wheatQuantity = 4;

        let riceCost = ricePrice * riceQuantity;
        let sugarCost = sugarPrice * sugarQuantity;
        let wheatCost = wheatPrice * wheatQuantity;

        console.log("Item: " + riceName);
        console.log("Price: ₹" + ricePrice);
        console.log("Quantity: " + riceQuantity);
        console.log("Cost: ₹" + riceCost);

        console.log("Item: " + sugarName);
        console.log("Price: ₹" + sugarPrice);
        console.log("Quantity: " + sugarQuantity);
        console.log("Cost: ₹" + sugarCost);

        console.log("Item: " + wheatName);
        console.log("Price: ₹" + wheatPrice);
        console.log("Quantity: " + wheatQuantity);
        console.log("Cost: ₹" + wheatCost);

        let totalBill = riceCost + sugarCost + wheatCost;
        console.log("Total Bill: ₹" + totalBill);

        riceQuantity = 5;
        riceCost = ricePrice * riceQuantity;
        totalBill = riceCost + sugarCost + wheatCost;

        console.log("Updated Rice Quantity: " + riceQuantity);
        console.log("Updated Rice Cost: ₹" + riceCost);
        console.log("Updated Total Bill: ₹" + totalBill);

    </script>
</body>
</html>
